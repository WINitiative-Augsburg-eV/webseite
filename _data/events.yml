# Kommende Events auf der Startseite.
# Neues Event = neuen Block kopieren und anpassen. Reihenfolge = Reihenfolge auf der Seite.
#
# title:    Name des Events
# date:     letzter Tag des Events (JJJJ-MM-TT). Danach verschwindet es automatisch.
#           Weglassen, wenn der Termin noch nicht feststeht.
# when:     Text, der als Datum angezeigt wird
# where:    Ort (optional)
# text:     kurze Beschreibung
# partner:  Schlüssel aus partners.yml, zeigt das Logo (optional)
# link / link-text:  Button (optional)

